<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocaz Pro | Apporteurs d'affaires</title>
<!-- Appli réservée aux pros : jamais référencée (voir aussi robots.txt). -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ocaz Apporteurs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="marque.css">
<link rel="stylesheet" href="messagerie.css">
<link rel="stylesheet" href="apporteur.css">
</head>
<body class="ap verrouille">
<!-- Plus d'inscription libre : les comptes apporteurs sont créés par l'administrateur. Cette carte ne sert qu'au
     mot de passe de départ à remplacer (première connexion), et reste cachée sinon. -->
<div id="auth" hidden>
  <form id="f-mdp" class="auth-carte ap-carte" novalidate>
    <img src="logo.svg" alt="" width="64" height="64">
    <h1><span class="brand-name">OCAZ</span> <span class="ap-marque">Apporteur</span></h1>
    <p class="muted" id="auth-texte">Première connexion : choisis ton mot de passe (8 caractères minimum).</p>
    <div class="field"><label for="n-mdp">Nouveau mot de passe</label><input id="n-mdp" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="n-mdp2">Confirme le mot de passe</label><input id="n-mdp2" type="password" autocomplete="new-password"></div>
    <p id="auth-erreur" class="auth-erreur" role="alert" hidden></p>
    <button type="submit" class="primary" id="n-ok">Enregistrer mon mot de passe</button>
    <button type="button" id="auth-sortir" class="lien">Se déconnecter</button>
  </form>
</div>

<header>
  <div class="brand" role="button" tabindex="0" title="Tableau de bord"><img src="logo.svg" alt="" width="34" height="34"><span class="brand-name">OCAZ</span><span class="ap-marque">Apporteur</span></div>
  <nav id="tabs">
    <button data-tab="leads" class="active">Suivi leads</button>
    <button data-tab="donnees">Tableau de bord</button>
    <button data-tab="reseau">Réseau</button>
  </nav>
  <a id="btn-espace" class="espace-bascule" href="./" title="Passer à mon espace garage" hidden>⇄ Garage</a>
  <button id="btn-msg" class="ghost msg-bouton" title="Messages" aria-label="Messages" hidden></button>
  <button id="btn-menu" class="ghost" title="Paramètres" aria-label="Paramètres"></button>
</header>

<main>
  <div id="vue"></div>
</main>

<nav id="bottom-tabs">
  <button data-tab="leads" class="active">Suivi leads</button>
  <button data-tab="donnees">Tableau de bord</button>
  <button data-tab="reseau">Réseau</button>
</nav>

<dialog id="dlg-lead" class="plein">
  <form id="f-lead" class="o-page" novalidate>
    <div class="o-tete"><h2>Envoyer un client au garage</h2>
      <button type="button" id="lead-fermer" class="ghost-dark" aria-label="Fermer">✕</button></div>
    <div class="o-body" id="lead-body"></div>
    <div class="actions o-actions"><span class="spacer"></span>
      <button type="button" id="lead-annuler">Annuler</button>
      <button type="submit" class="primary" id="lead-envoyer">Envoyer le lead</button></div>
  </form>
</dialog>

<div id="toast"></div>

<script src="maj.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="icons.js"></script>
<script src="messagerie.js"></script>
<script src="docbarre.js"></script>
<script src="commission.js"></script>
<script src="annonces.js"></script>
<script src="apporteur.js"></script>
</body>
</html>
